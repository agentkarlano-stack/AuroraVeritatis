name: Intro footage fetch (work branch)

# Work-branch helper for the cinematic intro: downloads the URLs listed in intro-work/fetch.txt
# ("<output path> <url>" per line) and commits them back to the same branch. Cloud sessions cannot reach
# stock-footage sites; GitHub runners can. Runs only on the intro work branch; never on main.
on:
  push:
    branches: [claude/intro-work]
    paths: [intro-work/fetch.txt]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Download
        run: |
          set -u
          ok=0; bad=0
          : > intro-work/fetch-log.txt
          while read -r out url start dur; do
            [ -z "${out:-}" ] && continue
            case "$out" in \#*) continue;; esac
            if [ "${start:-}" = "sheet" ]; then
              # "<out.jpg> <url> sheet": a 4x4 contact sheet (one frame per 1/16 of the clip) to review footage cheaply.
              mkdir -p "intro-work/$(dirname "$out")"
              curl -sL --max-time 600 -A "AuroraVeritatisMediaFetch/1.0 (https://aurorav.app; auroraveritatissup@gmail.com)" -o /tmp/src.bin "$url"
              d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/src.bin < /dev/null | cut -d. -f1)
              if ffmpeg -nostdin -hide_banner -loglevel error -y -i /tmp/src.bin -vf "fps=16/${d:-16},scale=360:-2,tile=4x4" -frames:v 1 -q:v 4 "intro-work/$out"; then
                echo "200 $(stat -c %s "intro-work/$out") $out $url sheet ${d}s $(ffprobe -v error -select_streams v -show_entries stream=width,height,r_frame_rate -of csv=p=0 /tmp/src.bin < /dev/null)" >> intro-work/fetch-log.txt; ok=$((ok+1))
              else
                echo "ERR 0 $out $url" >> intro-work/fetch-log.txt; bad=$((bad+1))
              fi
              sleep 2
              continue
            fi
            if [ -n "${dur:-}" ]; then
              # "<out> <url> <start s> <duration s>": trim a window, keep 1920 px, near-lossless, no audio.
              mkdir -p "intro-work/$(dirname "$out")"
              curl -sL --max-time 300 -o /tmp/src.mp4 "$url"
              if ffmpeg -nostdin -hide_banner -loglevel error -y -ss "$start" -t "$dur" -i /tmp/src.mp4 -an -vf "scale='min(1920,iw)':-2" -c:v libx264 -preset slow -crf 15 -pix_fmt yuv420p "intro-work/$out"; then
                echo "200 $(stat -c %s "intro-work/$out") $out $url $start $dur $(ffprobe -v error -select_streams v -show_entries stream=width,height,r_frame_rate -of csv=p=0 /tmp/src.mp4 < /dev/null)" >> intro-work/fetch-log.txt; ok=$((ok+1))
              else
                echo "ERR 0 $out $url" >> intro-work/fetch-log.txt; bad=$((bad+1))
              fi
              continue
            fi
            mkdir -p "intro-work/$(dirname "$out")"
            ua="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
            # Wikimedia asks for a descriptive User-Agent and polite request rates.
            case "$url" in *wikimedia.org*) ua="AuroraVeritatisMediaFetch/1.0 (https://aurorav.app; auroraveritatissup@gmail.com)"; sleep 2;; esac
            code=$(curl -sL --max-time 120 -A "$ua" -H "Accept-Language: en" -o "intro-work/$out" -w "%{http_code}" "$url" || echo 000)
            size=$(stat -c %s "intro-work/$out" 2>/dev/null || echo 0)
            echo "$code $size $out $url" >> intro-work/fetch-log.txt
            if [ "$code" = "200" ]; then ok=$((ok+1)); else bad=$((bad+1)); rm -f "intro-work/$out"; fi
          done < intro-work/fetch.txt
          echo "::notice title=Intro fetch::$ok downloaded, $bad failed"
      - name: Commit
        run: |
          git config user.name "intro-fetch"
          git config user.email "intro-fetch@users.noreply.github.com"
          git add intro-work
          git commit -m "intro-work: fetched files" || exit 0
          git push
