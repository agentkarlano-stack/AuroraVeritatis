name: Production smoke test

# Read-only HTTP checks of a live site (scripts/smoke.sh), on demand. Deploys nothing and uses no secrets.
# After merges, post-deploy.yml runs the same checks once the new deployment is live; PR code is smoke-tested on its
# own preview deployment (preview.yml).

on:
  workflow_dispatch:
    inputs:
      url:
        description: Base URL to test
        default: https://aurorav.app

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test
        run: scripts/smoke.sh "${{ inputs.url || 'https://aurorav.app' }}"
