name: Cloudflare preview

# Fallback preview deployments via wrangler, independent of Cloudflare Workers Builds.
# Uploads a new Worker *version* (no production traffic) and comments the preview URL on the PR.
# Inactive until the repository secret CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and the
# variable CLOUDFLARE_ACCOUNT_ID are configured. Production deploys stay with merges to main.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    outputs:
      url: ${{ steps.upload.outputs.url }}
      auth_changed: ${{ steps.changes.outputs.auth }}
    steps:
      - name: Skip when Cloudflare credentials are not configured
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping preview upload."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 0
      - name: Detect account-related changes
        id: changes
        if: env.HAS_TOKEN == 'true'
        run: |
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$files" | grep -qE '^(src/auth/|src/pages/(Account|SignIn|Headquarters)\.tsx|src/lib/sync|src/store/prefs|supabase/|e2e/live/|worker/|\.github/workflows/(live-auth|preview)\.yml)'; then
            echo "auth=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 22
          cache: npm
      - if: env.HAS_TOKEN == 'true'
        run: npm ci
      - name: Upload preview version
        if: env.HAS_TOKEN == 'true'
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} ${GITHUB_SHA::7}" | tee upload.log
          url=$(grep -oE 'https://[^ ]+\.workers\.dev' upload.log | tail -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          version=$(grep -oE 'Worker Version ID: [0-9a-f-]+' upload.log | tail -1 || true)
          echo "### Preview: ${url:-not reported (enable Preview URLs on the Worker)}" >> "$GITHUB_STEP_SUMMARY"
          echo "${version:-Worker Version ID not reported}" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Cloudflare preview::${version:-Worker Version ID not reported} · ${url:-no preview URL reported}"
      - name: Smoke test the preview (real Workers runtime, live upstream data)
        if: env.HAS_TOKEN == 'true' && steps.upload.outputs.url != ''
        run: |
          for i in $(seq 1 12); do curl -sf -o /dev/null "${{ steps.upload.outputs.url }}/api/health" && break; sleep 5; done
          scripts/smoke.sh "${{ steps.upload.outputs.url }}"
      - name: Check NASA GIBS map layers (informational)
        if: env.HAS_TOKEN == 'true'
        run: node scripts/check-gibs.mjs
      - name: Remind to run the live account test
        if: env.HAS_TOKEN == 'true' && steps.changes.outputs.auth == 'true' && !contains(github.event.pull_request.labels.*.name, 'live-auth')
        run: echo "::notice title=Live account test::This PR touches accounts. Add the 'live-auth' label to run the real-email test (3 emails) on the preview."
      - name: Comment preview URL
        if: env.HAS_TOKEN == 'true' && steps.upload.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none \
            --body "🔎 Preview for \`${GITHUB_SHA::7}\`: ${{ steps.upload.outputs.url }}"

  # Real-browser account test on the preview. It sends 3 real emails per run (Supabase hourly auth-email limit, Resend
  # free tier 100/day), so it runs only when the PR carries the "live-auth" label. Account-related PRs get a reminder.
  live-auth:
    needs: preview
    if: needs.preview.outputs.url != '' && contains(github.event.pull_request.labels.*.name, 'live-auth')
    uses: ./.github/workflows/live-auth.yml
    with:
      url: ${{ needs.preview.outputs.url }}
