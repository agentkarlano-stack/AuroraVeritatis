name: CI

# One job per pull request: lint, types, unit tests, production build and the Supabase migration/RLS tests on a
# throwaway Postgres. Superseded runs of the same PR are cancelled. Documentation-only changes skip CI (the repository
# has no required status checks, so nothing is left blocked). Merges to main are verified on the deployed site by
# post-deploy.yml instead of re-running the same checks.
on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Applies the Supabase migrations twice and runs the RLS, admin, session, subscription, organisation and AI tests.
      - name: Migration and access-control tests
        run: scripts/test-migrations.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
