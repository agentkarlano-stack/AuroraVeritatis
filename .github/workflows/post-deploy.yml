name: Post-deploy checks

# After a merge to main: wait until aurorav.app serves this commit (scripts/wait-for-deploy.sh polls /api/health,
# with a fixed 180 s fallback), run the HTTP smoke test, then a quick browser audit when site files changed.
# Replaces the separate fixed-wait smoke and UI-audit runs. A newer merge cancels an older run: the newer deployment
# contains the older change and is verified instead. The full UI audit runs nightly (ui-audit.yml).
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']

permissions:
  contents: read

concurrency:
  group: post-deploy
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Wait for the deployment of this commit
        run: scripts/wait-for-deploy.sh https://aurorav.app "$GITHUB_SHA" 480
      - name: Smoke test
        run: scripts/smoke.sh https://aurorav.app
      - name: Did site files change?
        id: changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(src/|public/|worker/|shared/|index\.html|vite\.config|package(-lock)?\.json|e2e/ui-audit)'; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.ui == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.changes.outputs.ui == 'true'
        run: npm ci
      - name: Quick UI audit (key routes at 360, 768 and 1440 px, all interaction checks, headers)
        if: steps.changes.outputs.ui == 'true'
        run: node e2e/ui-audit.ts
        env:
          BASE_URL: https://aurorav.app
          QUICK: '1'
