name: Briefing sound assets fetch (work branch)

# Work-branch helper: downloads the briefing sound-design assets generated by the PR preview route /api/sfx/<name>
# (ElevenLabs Sound Effects on the owner's plan, generated once) and commits them with a loudness/silence report.
# Cloud sessions cannot reach the preview; GitHub runners can. Runs only on this work branch; never on main.
on:
  push:
    branches: [claude/sfx-work]
    paths: [sfx-work/fetch.txt]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Download and analyse
        run: |
          set -u
          base=$(head -1 sfx-work/fetch.txt)
          mkdir -p sfx-work/out
          : > sfx-work/report.txt
          tail -n +2 sfx-work/fetch.txt | while read -r name; do
            [ -z "$name" ] && continue
            code=$(curl -s --max-time 90 -H 'x-aurora-asset-build: 1' -o "sfx-work/out/$name.mp3" -w '%{http_code}' "$base/api/sfx/$name" || echo 000)
            if [ "$code" != "200" ]; then echo "$name ERR $code $(head -c 300 sfx-work/out/$name.mp3)" >> sfx-work/report.txt; rm -f "sfx-work/out/$name.mp3"; continue; fi
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "sfx-work/out/$name.mp3")
            vol=$(ffmpeg -nostdin -hide_banner -i "sfx-work/out/$name.mp3" -af volumedetect -f null - 2>&1 | grep -E 'mean_volume|max_volume' | sed 's/.*\] //' | tr '\n' ' ')
            echo "$name 200 bytes=$(stat -c %s sfx-work/out/$name.mp3) duration=${dur}s $vol" >> sfx-work/report.txt
            sleep 2
          done
          echo "::notice title=SFX fetch::$(tr '\n' ' | ' < sfx-work/report.txt)"
      - name: Commit
        run: |
          git config user.name "sfx-fetch"
          git config user.email "sfx-fetch@users.noreply.github.com"
          git add sfx-work
          git commit -m "sfx-work: generated assets and report" || exit 0
          git push
